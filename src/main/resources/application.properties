# APPLICATION
# =========================
spring.application.name=UniversalERP
# =========================
# SERVER
# =========================
server.port=8888
# =========================
# MYSQL DATABASE
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/zest_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Poppingsoul}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
# =========================
# LOGGING
# =========================
logging.level.org.hibernate.SQL=info
logging.level.org.hibernate.orm.jdbc.bind=info
logging.level.org.springframework.security=TRACE

# =====================================================
# JWT Configuration
# =====================================================
# Secret Key (minimum 32 bytes)
spring.security.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-32-byte-minimum-value}
# Issuer
spring.security.jwt.issuer=${JWT_ISSUER:UniversalERP}
# Access Token Expiry (15 Minutes)
spring.security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900000}
# Refresh Token Expiry (7 Days)
spring.security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:604800000}
# Cookie Names
spring.security.jwt.access-token-cookie-name=${JWT_ACCESS_COOKIE_NAME:access_token}
spring.security.jwt.refresh-token-cookie-name=${JWT_REFRESH_COOKIE_NAME:refresh_token}
# Cookie Properties
spring.security.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
spring.security.jwt.http-only=${JWT_HTTP_ONLY:true}
spring.security.jwt.same-site=${JWT_SAME_SITE:Lax}


